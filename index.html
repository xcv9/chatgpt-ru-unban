<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:#0f172a;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card {
  background:#020617;
  padding:32px;
  border-radius:20px;
  max-width:480px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  text-align:center;
}
h1 {
  margin:0 0 12px;
}
p {
  opacity:.85;
}
.notice {
  margin-top:20px;
  font-size:14px;
  opacity:.6;
}
</style>
</head>
<body>

<div class="card">
  <h1>AI Assistant</h1>
  <p>This site will host an AI-powered chat assistant.</p>
  <p>The service is currently under development.</p>
  <div class="notice">
    Powered by open technologies · Public demo
  </div>
</div>

</body>
</html>
